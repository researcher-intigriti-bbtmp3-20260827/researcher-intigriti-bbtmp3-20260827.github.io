<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controlled Bybit Clipboard Bridge Probe</title>
<style>body{font:14px monospace;background:#111;color:#eee;padding:12px;word-break:break-word}h1{font:18px sans-serif;color:#f7a600}pre{white-space:pre-wrap;border:1px solid #555;padding:10px}</style>
<h1>Controlled Bybit Clipboard Bridge Probe</h1><pre id="out">starting</pre>
<script>
const log=[];const out=document.getElementById('out');
function add(k,v){let s;try{s=typeof v==='string'?v:JSON.stringify(v)}catch(e){s=String(v)}log.push(k+': '+s);out.textContent=log.join(String.fromCharCode(10))}
window.onerror=(m,s,l,c,e)=>add('windowError',{message:m,line:l,column:c,error:String(e)});
window._b_bridge_callback_=function(){add('callback',Array.from(arguments))};
function send(moduleName,methodName){const b=window['_b_bridge_'+moduleName+'_'];const msg={moduleName,methodName,uniqueId:'clip-'+Date.now(),params:{}};try{if(!b||typeof b.postMessage!=='function')return add('noBridge',moduleName);b.postMessage(JSON.stringify(msg));add('sent',msg)}catch(e){add('sendError '+moduleName+'.'+methodName,String(e))}}
function run(){add('href',location.href);add('bridges',Object.getOwnPropertyNames(window).filter(x=>x.startsWith('_b_bridge_')).sort());send('SystemInfo','getTextFromClipboard')}
addEventListener('flutterInAppWebViewPlatformReady',()=>{add('event','ready');setTimeout(run,250)});
setTimeout(run,1500);
</script>
