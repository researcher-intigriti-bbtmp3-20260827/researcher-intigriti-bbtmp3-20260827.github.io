<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controlled Bybit WebView Probe</title>
<style>body{font:14px monospace;background:#111;color:#eee;padding:12px;word-break:break-word}h1{font:18px sans-serif;color:#f7a600}pre{white-space:pre-wrap;border:1px solid #555;padding:10px}</style>
<h1>Controlled Bybit WebView Probe</h1><pre id="out">starting</pre>
<script>
const log=[];const out=document.getElementById('out');
function add(k,v){let s;try{s=typeof v==='string'?v:JSON.stringify(v)}catch(e){s=String(v)}log.push(k+': '+s);out.textContent=log.join(String.fromCharCode(10))}
window.onerror=(m,s,l,c,e)=>add('windowError',{message:m,line:l,column:c,error:String(e)});
function scan(){try{add('href',location.href);add('ua',navigator.userAgent);const names=Object.getOwnPropertyNames(window).filter(x=>/bridge|flutter|bybit|webview|thrio|native/i.test(x)).sort();add('windowNames',names);for(const n of names){try{const v=window[n];add('obj '+n,{type:typeof v,keys:v&&(typeof v==='object'||typeof v==='function')?Object.keys(v):[],postMessage:!!(v&&v.postMessage),callHandler:!!(v&&v.callHandler)})}catch(e){add('err '+n,String(e))}}}catch(e){add('scanError',String(e))}}
addEventListener('flutterInAppWebViewPlatformReady',()=>{add('event','flutterInAppWebViewPlatformReady');scan()});
setTimeout(scan,500);setTimeout(scan,2500);
</script>
